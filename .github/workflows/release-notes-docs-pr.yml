name: Release Notes Docs PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to use (e.g. v4.1.1)'
        required: true
      dry_run:
        description: 'Dry run: fetch release notes and print MDX without creating a PR'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # --- Agent-specific config (change these when reusing for other agents) ---
  AGENT_REPO: newrelic/video-agent-roku
  AGENT_NAME: Roku
  AGENT_SLUG: roku
  AGENT_FILE_PREFIX: streaming-others-agent
  AGENT_SUBJECT: Streaming Video & Ads for others
  AGENT_SUBJECT_SLUG: streaming-video-and-ads-for-others
  # --- Shared docs config ---
  DOCS_FOLDER: src/content/docs/release-notes/streaming-others-release-notes

jobs:
  update-public-docs:
    name: Update public docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: newrelic
          repositories: docs-website

      - name: Resolve release tag and body
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          version="${tag#v}"
          releaseDate=$(grep -m1 "^## \[${version}\]" CHANGELOG.md | \
            grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          body=$(awk -v ver="${version}" '
            found && /^## +\[|^# / { exit }
            found { print }
            $0 ~ ("^## +\\[" ver "\\]") { found=1 }
          ' CHANGELOG.md | sed -E 's/ *\(\[[0-9a-f]{6,40}\]\([^)]*\)\) *$//')
          body=$(printf '%s' "${body}" | sed '/[^[:space:]]/,$!d' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba}')
          if [[ -z "${body}" ]]; then
            body="_No new features, improvements, or bug fixes for this release._"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releaseDate=${releaseDate}" >> "$GITHUB_OUTPUT"
          echo "body<<RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"
          echo "${body}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Parse CHANGELOG sections
        id: parse
        env:
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          declare -A section_items
          for k in features enhancements bugs security; do section_items[$k]=""; done

          category_to_key() {
            local cat="$1"
            case "$cat" in
              "New feature")   echo "features" ;;
              "Bug fix")       echo "bugs" ;;
              "Improvement")   echo "enhancements" ;;
              "Security")      echo "security" ;;
              *)  echo "$cat" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 ]//g; s/ \+/-/g; s/^-//; s/-$//' ;;
            esac
          }

          while IFS= read -r line; do
            if [[ "$line" =~ ^\-[[:space:]]\*\*([^:]+):[[:space:]](.+)\*\*$ ]]; then
              key=$(category_to_key "${BASH_REMATCH[1]}")
              item="${BASH_REMATCH[2]}"
              section_items[$key]+="${item}"$'\x01'
            fi
          done <<< "${RELEASE_BODY}"

          yaml_array() {
            local key="$1"
            local items="${section_items[$key]}"
            if [[ -n "$items" ]]; then
              local json=""
              IFS=$'\x01' read -ra arr <<< "${items%$'\x01'}"
              for item in "${arr[@]}"; do
                escaped=$(printf '%s' "$item" | sed 's/"/\\"/g')
                json+="\"${escaped}\", "
              done
              echo "[${json%, }]"
            else
              echo "[]"
            fi
          }

          echo "features=$(yaml_array features)" >> "$GITHUB_OUTPUT"
          echo "enhancements=$(yaml_array enhancements)" >> "$GITHUB_OUTPUT"
          echo "bugs=$(yaml_array bugs)" >> "$GITHUB_OUTPUT"
          echo "security=$(yaml_array security)" >> "$GITHUB_OUTPUT"

      - name: Clone docs-website
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh repo clone newrelic/docs-website -- --depth=1 --branch develop --single-branch

      - name: Configure Git
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: docs-website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Generate MDX content
        id: mdx
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          releaseDate="${{ steps.release.outputs.releaseDate }}"
          versionSlug="${version//./-}"
          releaseFile="${{ env.DOCS_FOLDER }}/${{ env.AGENT_SUBJECT_SLUG }}-${{ env.AGENT_SLUG }}-${versionSlug}.mdx"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releaseFile=${releaseFile}" >> "$GITHUB_OUTPUT"
          echo "releaseDate=${releaseDate}" >> "$GITHUB_OUTPUT"

      - name: '[Dry run] Print MDX content'
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          PARSE_FEATURES: ${{ steps.parse.outputs.features }}
          PARSE_ENHANCEMENTS: ${{ steps.parse.outputs.enhancements }}
          PARSE_BUGS: ${{ steps.parse.outputs.bugs }}
          PARSE_SECURITY: ${{ steps.parse.outputs.security }}
        run: |
          echo "=== DRY RUN: MDX file that would be created ==="
          echo "File: ${{ steps.mdx.outputs.releaseFile }}"
          echo ""
          printf '%s\n' '---'
          printf '%s\n' 'subject: ${{ env.AGENT_SUBJECT }}'
          printf "releaseDate: '%s'\n" "${{ steps.mdx.outputs.releaseDate }}"
          printf "version: %s\n" "${{ steps.mdx.outputs.version }}"
          printf "features: %s\n" "${PARSE_FEATURES}"
          printf "enhancements: %s\n" "${PARSE_ENHANCEMENTS}"
          printf "bugs: %s\n" "${PARSE_BUGS}"
          printf "security: %s\n" "${PARSE_SECURITY}"
          printf '%s\n' 'category: ${{ env.AGENT_NAME }}'
          printf '%s\n' '---'
          printf '\n'
          printf '%s\n' "${RELEASE_BODY}"

      - name: Write release notes and open PR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: docs-website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          PARSE_FEATURES: ${{ steps.parse.outputs.features }}
          PARSE_ENHANCEMENTS: ${{ steps.parse.outputs.enhancements }}
          PARSE_BUGS: ${{ steps.parse.outputs.bugs }}
          PARSE_SECURITY: ${{ steps.parse.outputs.security }}
        run: |
          version="${{ steps.mdx.outputs.version }}"
          releaseDate="${{ steps.mdx.outputs.releaseDate }}"
          releaseFile="${{ steps.mdx.outputs.releaseFile }}"
          branchName="add-${{ env.AGENT_SLUG }}-release-notes-$(date -u '+%y-%m-%d')"
          summary="Add release notes for ${{ env.AGENT_NAME }} agent v${version}"

          if [[ -e "${releaseFile}" ]]; then
            echo "File '${releaseFile}' already exists. Nothing to do."
            exit 0
          fi

          {
            printf '%s\n' '---'
            printf '%s\n' 'subject: ${{ env.AGENT_SUBJECT }}'
            printf "releaseDate: '%s'\n" "${releaseDate}"
            printf "version: %s\n" "${version}"
            printf "features: %s\n" "${PARSE_FEATURES}"
            printf "enhancements: %s\n" "${PARSE_ENHANCEMENTS}"
            printf "bugs: %s\n" "${PARSE_BUGS}"
            printf "security: %s\n" "${PARSE_SECURITY}"
            printf '%s\n' 'category: ${{ env.AGENT_NAME }}'
            printf '%s\n' '---'
            printf '\n'
            printf '%s\n' "${RELEASE_BODY}"
          } > "${releaseFile}"

          git checkout -b "${branchName}"
          git add "${releaseFile}"
          git commit --message="feat: ${summary}"
          git push --set-upstream origin "${branchName}"

          gh pr create \
            --repo newrelic/docs-website \
            --base develop \
            --head "${branchName}" \
            --title "feat: ${summary}" \
            --body "Automated PR: release notes for ${{ env.AGENT_NAME }} agent v${version}."
